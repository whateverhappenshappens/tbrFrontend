name: Deploy to Production

on:
  push:
    branches:
      - build

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies & build
      run: |
        # ignore peer dep conflicts so react-google-login can coexist with React 18
        npm ci --legacy-peer-deps
        npm run build

    - name: Copy build to prod server
      env:
        SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        EC2_HOST: ${{ secrets.EC2_HOST }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        # extract the host (strip user@)
        HOST="${EC2_HOST#*@}"
        ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
        scp -i ~/.ssh/id_rsa -r dist/* $EC2_HOST:/var/www/techbairn.com/
        ssh -i ~/.ssh/id_rsa $EC2_HOST "sudo systemctl reload nginx"
