name: Deploy to Staging

on:
  push:
    branches:
      - Prod

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies & build
      run: |
        # ignore peer dep conflicts so react-google-login can coexist with React 18
        npm ci --legacy-peer-deps
        npm run build
        
    - name: Copy build to staging server
      env:
        SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        EC2_HOST: ${{ secrets.EC2_HOST }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # extract just the hostname (e.g. 3.108.165.88)
        HOST="${EC2_HOST#*@}"
        # optional: add host key 
        ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
        # deploy (no need to ssh-scan the user@ part)
        scp -o StrictHostKeyChecking=no \
        -i ~/.ssh/id_rsa \
        -r dist/* \
        $EC2_HOST:/var/www/staging.techbairn.com/
        ssh -o StrictHostKeyChecking=no \
        -i ~/.ssh/id_rsa \
        $EC2_HOST \
        "sudo systemctl reload nginx"
