name: Deploy with Backup Strategy

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Upload to a TEMPORARY folder first
      # We use strip_components to ensure files land flat inside 'incoming_build'
      - name: Upload to Temp Folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/home/ec2-user/frontend/incoming_build" 
          strip_components: 1

      # Step 2: Atomic Swap
      - name: Swap and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/frontend

            # 1. Clean up old backup
            rm -rf lastBuild

            # 2. Backup current site (if it exists)
            if [ -d "dist" ]; then
              mv dist lastBuild
            fi

            # 3. Move new files to 'dist'
            # Since 'incoming_build' is now flat (thanks to strip_components),
            # this renaming results in the correct final structure.
            mv incoming_build dist

            # 4. Restart
            sudo systemctl reload nginx
            echo "Deployment Complete!"
