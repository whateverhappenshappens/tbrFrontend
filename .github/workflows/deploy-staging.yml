name: Deploy to Staging

on:
  push:
    branches:
      - Prod

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies & build
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Prepare SSH key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf "Host *\n  StrictHostKeyChecking no\n" > ~/.ssh/config

      - name: Create remote temp folder
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 ec2-user@$EC2_HOST "mkdir -p /home/ec2-user/tmp-staging"

      - name: Copy build to remote temp folder
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/id_ed25519 -r dist/* ec2-user@$EC2_HOST:/home/ec2-user/tmp-staging/

      - name: Move build into staging directory and reload Nginx
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 ec2-user@$EC2_HOST "
            sudo rm -rf /var/www/staging.techbairn.com/* &&
            sudo mv /home/ec2-user/tmp-staging/* /var/www/staging.techbairn.com/ &&
            sudo systemctl reload nginx
          "
